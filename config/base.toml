# Non-secret defaults shared by every environment.
#
# Values here are committed to version control. Anything typed as a secret in
# tradingsys/config/settings.py is refused from this file at startup: supply those
# through environment variables or the secrets directory.
#
# Per-environment overrides live in development.toml, test.toml, staging.toml, and
# production.toml, each layered on top of this file.

[app]
name = "tradingsys"
environment = "development"
shutdown_grace_seconds = 20.0
allow_live_trading = false

[database]
host = "localhost"
port = 5432
database = "tradingsys"
user = "tradingsys"
min_pool_size = 2
max_pool_size = 10
connect_timeout_seconds = 10.0
command_timeout_seconds = 30.0
# asyncpg's per-connection prepared statement cache. Kept off by default because
# PgBouncer in transaction pooling mode cannot support it.
statement_cache_size = 0
ssl_mode = "prefer"

[redis]
host = "localhost"
port = 6379
db = 0
socket_timeout_seconds = 5.0
connect_timeout_seconds = 5.0

[observability]
service_name = "tradingsys"
log_level = "info"
log_format = "json"
http_host = "0.0.0.0"
http_port = 8000
health_path = "/health"
ready_path = "/ready"
metrics_path = "/metrics"
readiness_timeout_seconds = 3.0

[ingest]
# Intervals and stall deadlines for the ingest process. Every deadline is compared
# against the wall clock by the supervisor, never counted by a loop, for the reason in
# the clock defect class in docs/DECISIONS.md.

# Venue metadata changes rarely. Six hours is not once at startup on purpose: a broker
# that changes a minimum lot mid-run has to be noticed during the run, because that
# minimum is what the eligibility screen excludes instruments on.
registry_interval_seconds = 21600.0
registry_deadline_seconds = 25200.0

# The backfill queues whatever hours the gap detector finds missing inside its window.
backfill_interval_seconds = 3600.0
backfill_deadline_seconds = 5400.0

# WHAT BREAKS IF THIS SHRINKS: the window must exceed the deadline above, or an hour
# can fall out of every window before any pass considers it and is then never
# backfilled, with an empty queue and successful passes reporting nothing wrong. Seven
# days also covers a multi-day outage without a manual catch-up.
backfill_window_seconds = 604800.0

# Bybit publishes a level one snapshot at least every three seconds even when nothing
# changes, so silence well past that is death rather than a quiet market. Thirty
# seconds is ten of those, which tolerates a reconnect with its backoff.
quote_deadline_seconds = 30.0

[venues.forex]
# cTrader Open API, reached through Pepperstone. See PROGRESS.md for why this is
# cTrader rather than OANDA.
#
# account_id and the four OAuth values are deliberately absent here. The account is
# deployment specific and the credentials are secrets, so all five come from the
# environment; enabling the venue without them fails at startup.
#
# The trading connection is a persistent TLS socket carrying protobuf, not HTTP, which
# is why this is a host and a port rather than a URL. token_url is the separate HTTPS
# endpoint used to exchange a refresh token for a new access token, confirmed against
# help.ctrader.com/open-api/account-authentication.
#
# Both hostnames are listed and the code selects between them by `environment`. There
# is deliberately no single `api_host` field: the two environments are fully separated
# at the venue, a live endpoint cannot serve demo accounts or the reverse, so a
# deployment must not be able to express the mismatch.
#
# Port 5035 carries protobuf and nothing else; 5036 is the JSON port and this client
# does not speak it. The connection is always TLS.
enabled = false
environment = "practice"
demo_api_host = "demo.ctraderapi.com"
live_api_host = "live.ctraderapi.com"
api_port = 5035
token_url = "https://openapi.ctrader.com/apps/token"
request_timeout_seconds = 10.0
# The venue sends its own heartbeat every 30 seconds, measured against
# demo.ctraderapi.com on 2026-08-16 over a 150 second idle window: gaps of 30.0, 30.1,
# 30.0, 29.9. An idle forex socket carries nothing else, which is its normal state over
# a weekend, so this deadline is sized against that interval and not against quote flow.
# 95 seconds means the connection is declared dead only after two consecutive venue
# heartbeats have been missed, with five seconds of margin for jitter. The previous
# value of 20 seconds was shorter than the venue's own heartbeat and would have killed
# every healthy idle connection.
stream_read_timeout_seconds = 95.0
max_retries = 3
retry_backoff_seconds = 0.5
max_requests_per_second = 30.0
# The venue documents that it closes a connection silent for longer than 30 seconds, and
# sends its own heartbeat so that a client can tell a quiet connection from a dead one.
# Ten seconds gives two missed heartbeats of margin before the venue's own timeout, and
# sits well below stream_read_timeout_seconds so that a normal quiet period cannot trip
# the read deadline and declare a healthy connection dead.
heartbeat_interval_seconds = 10.0
# Access tokens last about 30 days. Refreshing three days out leaves room for several
# retries before the token actually dies, and a dead token needs manual reauthorisation.
token_refresh_margin_seconds = 259200.0

[venues.crypto.bybit]
enabled = false
exchange_id = "bybit"
sandbox = true
mainnet_rest_url = "https://api.bybit.com"
testnet_rest_url = "https://api-testnet.bybit.com"
mainnet_ws_public_url = "wss://stream.bybit.com/v5/public"
testnet_ws_public_url = "wss://stream-testnet.bybit.com/v5/public"
request_timeout_seconds = 10.0
# The venue permits 600 requests per five seconds per IP and answers a breach with a
# ten minute block. Nothing here needs that rate, so the cap keeps a wide margin.
max_requests_per_second = 10.0
max_retries = 5
retry_backoff_seconds = 0.5
# Bybit's own documented figures: ping every 20 seconds, idle connections cut at ten
# minutes. The receive timeout is ours, set between the two.
ws_ping_interval_seconds = 20.0
ws_receive_timeout_seconds = 30.0
