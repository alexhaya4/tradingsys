# Production overrides, layered on top of base.toml.
#
# Enabling a live venue also requires app.allow_live_trading, which is deliberately
# left false here: arming real orders is an explicit, reviewable change rather than a
# side effect of deploying to production.

[app]
environment = "production"
shutdown_grace_seconds = 30.0
allow_live_trading = false

[observability]
log_level = "info"
log_format = "json"

[database]
min_pool_size = 5
max_pool_size = 20
command_timeout_seconds = 15.0
ssl_mode = "require"

[venues.forex]
# Selecting the live endpoint is what `environment = "live"` means; the hostname comes
# from base.toml and is chosen by that setting rather than restated here. Enabling this
# also requires app.allow_live_trading, which stays false: arming real orders is a
# reviewable change, not a deploy.
enabled = false
environment = "live"

[venues.crypto.bybit]
# Enabled for recording. A recorder that starts and records nothing is the failure the
# universe configuration exists to prevent, and crypto spread history only accumulates
# forward: Bybit publishes none of it, so a day not recording is permanently lost.
#
# THIS ARMS NOTHING. No api_key or api_secret is set, so this venue can reach public
# market data and metadata and cannot submit an order. app.allow_live_trading stays
# false above, and the live venue guard keys on credentials for exactly this reason:
# adding credentials here would require that flag again, automatically.
enabled = true
sandbox = false
