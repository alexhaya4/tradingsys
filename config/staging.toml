# Staging overrides, layered on top of base.toml.
#
# Staging runs the production code path against the venues' practice environments, so
# the only differences from production are the venue hostnames and the pool sizing.

[app]
environment = "staging"

[observability]
log_level = "info"
log_format = "json"

[database]
min_pool_size = 2
max_pool_size = 10
ssl_mode = "require"

[venues.forex]
# Staging runs against the cTrader demo endpoint, which is what base.toml already
# points at; only `enabled` differs.
enabled = true
environment = "practice"

[venues.crypto.bybit]
enabled = true
sandbox = true
