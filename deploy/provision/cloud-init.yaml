#cloud-config
#
# Droplet user data. Paste this into the DigitalOcean "User data" field when creating
# the droplet, after replacing the SSH key placeholder below.
#
# This file does the part that must happen before the repository exists on the host:
# a non-root user, Docker, a firewall, swap, and UTC. Everything after that is
# deploy/provision/bootstrap.sh, which is idempotent and lives in the repository.
#
# WHAT BREAKS IF THIS CHANGES: the bootstrap script assumes the `tradingsys` user, the
# docker group membership, and that /opt/tradingsys is writable by that user. Changing
# any of the three means changing bootstrap.sh with it.

timezone: UTC

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - ufw
  - unattended-upgrades

users:
  - name: tradingsys
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      # REPLACE with the public key you will connect with. Without this you are locked
      # out, because password authentication is disabled below.
      - ssh-ed25519 AAAA_REPLACE_WITH_YOUR_PUBLIC_KEY

write_files:
  # A 2 GB swap file. Not a substitute for RAM, and Postgres should never be swapping
  # in steady state. It exists so that a transient spike, most likely the daily
  # compression job, fails slowly rather than triggering the OOM killer on a 4 GB host.
  - path: /etc/sysctl.d/99-tradingsys.conf
    content: |
      vm.swappiness=10
      vm.overcommit_memory=2
      vm.overcommit_ratio=90

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # Docker from Docker's own repository rather than the distribution's, because the
  # distribution package lags and compose v2 is a plugin there.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker tradingsys
  - systemctl enable --now docker

  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - sh -c 'echo "/swapfile none swap sw 0 0" >> /etc/fstab'
  - sysctl --system

  # Only SSH is reachable. Every operational port in docker-compose.yml binds to
  # 127.0.0.1, so Grafana, Prometheus, Postgres and the app are reached through an SSH
  # tunnel and are never exposed. If a port is ever published on 0.0.0.0 this firewall
  # is the only thing standing in front of it.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw --force enable

  - sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - systemctl restart ssh

  - install -d -o tradingsys -g tradingsys /opt/tradingsys
