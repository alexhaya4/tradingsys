# Local development stack.
#
# Secrets come from the environment, never from this file or from the TOML configs.
# Copy .env.example to .env and fill it in; compose reads .env automatically.

name: tradingsys

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TRADINGSYS_APP__ENVIRONMENT: development
      TRADINGSYS_CONFIG_DIR: /app/config
      TRADINGSYS_DATABASE__HOST: db
      TRADINGSYS_DATABASE__PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TRADINGSYS_REDIS__HOST: redis
      TRADINGSYS_OBSERVABILITY__HTTP_HOST: 0.0.0.0
      TRADINGSYS_OBSERVABILITY__HTTP_PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    # Compose uses the healthcheck to decide when dependents may start, which is a
    # readiness question, so this probes /ready rather than /health. Orchestrators that
    # distinguish the two should use /health for liveness and /ready for readiness.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: tradingsys
      POSTGRES_USER: tradingsys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Timescale tunes shared_preload_libraries itself; this only affects psql clients.
      PGTZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - max_connections=100
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingsys -d tradingsys"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  prometheus_data:
  grafana_data:
